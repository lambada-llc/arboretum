name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Verify only: this workflow never writes to the repository. Combined with
# `pull_request` (never `pull_request_target`), a fork's PR code runs with a
# read-only, secret-less token — the worst it can do is waste runner minutes.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Nothing here pushes, so don't leave a token in .git/config for the
          # build scripts (which a PR may rewrite) to find.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The cache is content-addressed — compiler and source for compiled
      # sources, term fingerprints for reduction results — so a restored entry
      # can only miss, never serve the wrong output for changed input. PR runs write to their own cache scope, not the base branch's.
      - uses: actions/cache@v4
        with:
          path: submodules/tree-calculus/bin/.cache
          key: lambada-chunks-${{ hashFiles('src/**/*.lamb', '.gitmodules') }}
          restore-keys: lambada-chunks-

      - run: ./build.sh

      # The expect-test contract: regenerating the outputs must change nothing.
      # A dirty src/ means either a bug (fix it) or an intentional change
      # (review and commit the updated results) — run ./build.sh locally to see
      # the same diff. --porcelain rather than `git diff`, so newly generated,
      # still-untracked outputs count as a failure too.
      - name: Check test outputs are unchanged
        run: |
          if [ -n "$(git status --porcelain -- src)" ]; then
            echo "FAIL: test outputs changed:"
            git --no-pager status --short -- src
            exit 1
          fi
          echo "OK: test outputs unchanged"

      # The same contract for what build.sh writes into lambada: the compilers
      # and the codemirror demo's scopes. Each is numbered from what it is built
      # from, so a change here means this source now builds something else, and
      # lambada would go on shipping the old one: commit the regenerated files
      # in lambada and pin submodules/lambada to that commit.
      - name: Check lambada holds what this source builds
        run: |
          if [ -n "$(git -C submodules/lambada status --porcelain)" ]; then
            echo "FAIL: build.sh changed what lambada ships:"
            git -C submodules/lambada --no-pager status --short
            exit 1
          fi
          echo "OK: lambada's exports unchanged"
